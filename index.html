<!DOCTYPE html>
<!-- ADIAK Team Maker: şagird saytı. Bütün fayllar EYNİ qovluqda (repo-nun kökündə) olmalıdır. -->
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>ADIAK Team Maker</title>
<link rel="stylesheet" href="style.css">
</head><body>
<!-- Səhifənin boş qabları: məzmunu JavaScript doldurur -->
<div id="root"></div><div id="modal"></div><div id="toast"></div><div id="toasts"></div>

<!-- 1) Supabase kitabxanası (internetdən) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<!-- 2) Saytın öz faylları. Sıra vacibdir: config → i18n → core → pages → main -->
<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="core.js"></script>
<script src="pages.js"></script>
<script src="main.js"></script>

<!-- 3) Fayl yüklənməyibsə, boş ekran əvəzinə hansının çatışmadığını yazır -->
<script>
(function(){
  var need=[["config.js",typeof SUPABASE_URL],["i18n.js",typeof tr],["core.js",typeof snd],["pages.js",typeof view],["main.js",typeof boot]];
  var miss=need.filter(function(x){return x[1]==="undefined"}).map(function(x){return x[0]});
  if(miss.length||!window.supabase){
    document.getElementById("root").innerHTML='<div style="max-width:440px;margin:12vh auto;padding:20px;font:16px system-ui;border:2px solid #dc2626;border-radius:16px">'
     +'<h3 style="margin-top:0;color:#dc2626">Bəzi fayllar tapılmadı</h3>'
     +'<p>'+(miss.length?'Tapılmayan: <b>'+miss.join(", ")+'</b>.':'Supabase kitabxanası yüklənmədi (internetə baxın).')+'</p>'
     +'<p>GitHub-da <b>bütün faylları eyni qovluğa</b> (repo-nun kökünə) yükləyin: index.html, style.css, config.js, i18n.js, core.js, pages.js, main.js (+ admin üçün admin.html, admin.css, admin.js).</p></div>';
  }
})();
</script>
</body></html>
