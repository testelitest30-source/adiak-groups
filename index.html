<!DOCTYPE html>
<!-- ADIAK Team Maker: şagird saytı. Quruluş üçün README.md faylına bax. -->
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Yalnız Android tətbiqində: viewport-fit=cover-siz viewport, Capacitor WebView-i status/naviqasiya zolaqlarının arasında yerləşdirsin (saytda heç nə etmir) -->
<script>if(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform()){var vm=document.createElement("meta");vm.name="viewport";vm.content="width=device-width, initial-scale=1";document.head.appendChild(vm)}</script>
<meta name="theme-color" content="#F4F1FD" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1F38" media="(prefers-color-scheme: dark)">
<meta name="description" content="ADIAK Team Maker: təqdimat üçün komanda qur, qruplarla söhbət et, xal qazan.">
<!-- Mövzunu səhifə çəkilməzdən əvvəl tətbiq edir (ağ/tünd yanıb-sönmə olmasın) -->
<script>try{var t=localStorage.getItem("theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<!-- Tətbiq kimi yükləmə (PWA) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="assets/icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ADIAK">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ADIAK Team Maker</title>
<!-- Purple Edition: şriftlər + tokenlər əvvəl, purple.css sonda (köhnə qaydaların üstündən yazır) -->
<link rel="preload" href="assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/plus-jakarta-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/features.css">
<link rel="stylesheet" href="assets/css/purple.css">
</head><body>
<script src="assets/js/shared/intro.js"></script>
<!-- Səhifənin boş qabları: məzmunu JavaScript doldurur -->
<div id="root"></div><div id="modal"></div><div id="toast"></div><div id="toasts"></div>

<!-- 1) Supabase kitabxanası (yerli surət: @supabase/supabase-js 2.45.4, dist/umd) -->
<script src="assets/vendor/supabase.js"></script>
<!-- 2) Saytın öz faylları. Sıra vacibdir: config → i18n → core → pages → extras → main -->
<script src="assets/js/shared/config.js"></script>
<script src="assets/js/shared/i18n.js"></script>
<script src="assets/js/shared/icons.js"></script>
<script src="assets/js/app/core.js"></script>
<script src="assets/js/app/pages.js"></script>
<script src="assets/js/app/extras.js"></script>
<script src="assets/js/app/main.js"></script>
<script src="assets/js/app/native.js"></script>
<!-- Service worker: yalnız https və localhost-da qeydə alınır (Capacitor native tətbiqində yox); xəta olsa sayt yenə də işləyir -->
<script>if("serviceWorker" in navigator&&!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform())&&(location.protocol==="https:"||location.hostname==="localhost"||location.hostname==="127.0.0.1")){addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}</script>

<!-- 3) Fayl yüklənməyibsə, boş ekran əvəzinə hansının çatışmadığını yazır -->
<script>
(function(){
  var need=[["config.js",typeof SUPABASE_URL],["i18n.js",typeof tr],["icons.js",typeof ic],["core.js",typeof snd],["pages.js",typeof view],["extras.js",typeof openPalette],["main.js",typeof boot]];
  var miss=need.filter(function(x){return x[1]==="undefined"}).map(function(x){return x[0]});
  if(miss.length||!window.supabase){
    document.getElementById("root").innerHTML='<div style="max-width:440px;margin:12vh auto;padding:20px;font:16px system-ui;border:2px solid #dc2626;border-radius:16px">'
     +'<h3 style="margin-top:0;color:#dc2626">Bəzi fayllar tapılmadı</h3>'
     +'<p>'+(miss.length?'Tapılmayan: <b>'+miss.join(", ")+'</b>.':'Supabase kitabxanası yüklənmədi (internetə baxın).')+'</p>'
     +'<p>Layihənin <b>qovluq quruluşunu dəyişmədən</b> (index.html, assets/, admin/, sw.js, manifest.webmanifest) GitHub-a yükləyin.</p></div>';
  }
})();
</script>
</body></html>
