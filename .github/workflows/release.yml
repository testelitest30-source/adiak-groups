name: Android release (signed APK + AAB)

# Manual run (to verify signing), a pushed v* tag, or a manual run with release_tag + target: then the job builds exactly
# `target` (a commit on main), and creates the tag + GitHub Release server-side. Creating a release needs the owner's approval.
# Signing material lives ONLY in repository secrets:
#   ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD, ANDROID_CERT_SHA256 (expected fingerprint)
# Firebase: GOOGLE_SERVICES_JSON.
on:
  workflow_dispatch:
    inputs:
      release_tag: { description: "Tag to create, e.g. v1.0.0 (empty = signing check only)", required: false, default: "" }
      target: { description: "Full commit SHA on main to build and tag", required: false, default: "" }
  push:
    tags: ["v*"]
    # Pre-merge signing check on the 1.0 branch: build + verify + artifact only (a GitHub Release needs a v* tag).
    branches: ["ccr-fb87e4c6-x8qay5"]

permissions:
  contents: write   # attach artifacts to the GitHub Release for v* tags

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TAG: ${{ inputs.release_tag || github.ref_name }}
      TARGET: ${{ inputs.target || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.target || github.sha }}", fetch-depth: 0 }
      - name: Release inputs
        if: inputs.release_tag != ''
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::release_tag must look like v1.2.3"; exit 1; }
          [[ "$TARGET" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::target must be a full commit SHA"; exit 1; }
          git fetch -q origin main && git merge-base --is-ancestor "$TARGET" origin/main || { echo "::error::target is not on main"; exit 1; }
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then echo "::error::tag $TAG already exists"; exit 1; fi
          echo "Building $TAG from $TARGET"
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Stage web assets
        run: npm run build
        env: { HEAD_SHA: "${{ inputs.target || github.sha }}", RUN_NUMBER: "${{ github.run_number }}" }
      - run: npx cap sync android
      - name: Firebase config from secret
        env: { GOOGLE_SERVICES_JSON: "${{ secrets.GOOGLE_SERVICES_JSON }}" }
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then echo "::error::GOOGLE_SERVICES_JSON secret missing: a release without push is not allowed"; exit 1; fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          node -e "JSON.parse(require('fs').readFileSync('android/app/google-services.json','utf8'))" 2>/dev/null || printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
          node -e "const j=JSON.parse(require('fs').readFileSync('android/app/google-services.json','utf8'));if(!(j.client||[]).some(c=>c.client_info.android_client_info.package_name==='az.adiak.teammaker'))process.exit(1);console.log('Firebase project: '+j.project_info.project_id+' (push-fcm service account project must match)')"
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - uses: gradle/actions/wrapper-validation@v4
      - name: Keystore from secrets
        id: ks
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            if [ "${{ github.ref_type }}" = "branch" ] && [ "${{ github.event_name }}" = "push" ]; then
              echo "::notice::Signing secrets are not configured yet: branch run skips the signed build (see docs/1.0/en/backup-and-keystore.md)"
              echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "::error::Signing secrets are not configured (see docs/1.0/en/backup-and-keystore.md)"; exit 1
          fi
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/adiak-release.jks"
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - name: Build signed APK + AAB
        if: steps.ks.outputs.ok == 'true'
        working-directory: android
        env:
          ADIAK_KEYSTORE: ${{ runner.temp }}/adiak-release.jks
          ADIAK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ADIAK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ADIAK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace
      - name: Verify signature
        if: steps.ks.outputs.ok == 'true'
        env: { EXPECTED: "${{ secrets.ANDROID_CERT_SHA256 }}" }
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/certs.txt" | grep -E "Verified using|certificate SHA-256"
          GOT=$(grep -m1 "certificate SHA-256 digest" "$RUNNER_TEMP/certs.txt" | awk '{print $NF}')
          if [ -n "$EXPECTED" ] && [ "$(echo "$GOT" | tr -d ':' | tr A-F a-f)" != "$(echo "$EXPECTED" | tr -d ': ' | tr A-F a-f)" ]; then echo "::error::APK is signed with an unexpected certificate"; exit 1; fi
          echo "Signed with certificate SHA-256: $GOT"
          mkdir -p dist && cp "$APK" dist/ADIAK-$TAG.apk && cp android/app/build/outputs/bundle/release/app-release.aab dist/ADIAK-$TAG.aab
          sha256sum dist/* | tee dist/SHA256SUMS.txt
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/adiak-release.jks" android/app/google-services.json
      - uses: actions/upload-artifact@v4
        if: steps.ks.outputs.ok == 'true'
        with: { name: "adiak-release-${{ inputs.release_tag || github.ref_name }}-run${{ github.run_number }}", path: dist/, retention-days: 30, if-no-files-found: error }
      - name: Create the GitHub Release (v* tag push, or manual release_tag)
        if: steps.ks.outputs.ok == 'true' && (startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '')
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "$TAG" dist/* --target "$TARGET" --title "ADIAK $TAG" --notes-file docs/1.0/az/release-notes.md || gh release upload "$TAG" dist/* --clobber
