name: Android debug APK

on:
  pull_request:
  push:
    branches: [feature/phase-2-android, ccr-fb87e4c6-x8qay5]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Capacitor 8 CLI requires Node >= 22
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (lockfile)
        run: npm ci

      - name: Stage web assets into www/
        run: npm run build
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_NUMBER: ${{ github.run_number }}

      - name: Capacitor sync
        run: npx cap sync android

      # FCM: rebuild android/app/google-services.json from the repository secret (raw JSON or base64).
      # Never printed, never committed (.gitignore). Without the secret (forks) the app builds without push.
      - name: Firebase config from secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then echo "GOOGLE_SERVICES_JSON not available: building without push"; exit 0; fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          if ! node -e "JSON.parse(require('fs').readFileSync('android/app/google-services.json','utf8'))" 2>/dev/null; then
            printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
          fi
          node -e "const j=JSON.parse(require('fs').readFileSync('android/app/google-services.json','utf8'));const ok=(j.client||[]).some(c=>c.client_info&&c.client_info.android_client_info&&c.client_info.android_client_info.package_name==='az.adiak.teammaker');if(!ok){console.error('google-services.json has no Android client for az.adiak.teammaker');process.exit(1)}console.log('google-services.json OK (package az.adiak.teammaker)')"

      # AGP 8.13 / Gradle 8.14.3 (Capacitor 8.6 template) run on JDK 21
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # The merged manifest must carry what the WebView features need (voice messages need BOTH audio permissions:
      # Capacitor's BridgeWebChromeClient denies AUDIO_CAPTURE unless RECORD_AUDIO and MODIFY_AUDIO_SETTINGS are granted).
      - name: Check APK permissions
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          P=$("$BT/aapt2" dump permissions android/app/build/outputs/apk/debug/app-debug.apk)
          echo "$P"
          for x in INTERNET POST_NOTIFICATIONS RECORD_AUDIO MODIFY_AUDIO_SETTINGS CAMERA; do
            echo "$P" | grep -q "android.permission.$x" || { echo "missing android.permission.$x"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: adiak-debug-apk-run${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
